<section id="projects" class="min-h-screen flex flex-col justify-center pt-32 pb-24 px-8 max-w-7xl mx-auto">
  <!-- Left-aligned Header -->
  <div class="mb-16 text-left">
    <h2 class="text-xs uppercase tracking-[0.3em] text-gray-500 mb-3">PORTFOLIO</h2>
    <h3 class="text-4xl font-bold text-brand-gold italic">Featured Projects</h3>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-12">
    <div *ngFor="let project of projects" 
         class="group bg-brand-gray/20 border border-white/5 rounded-3xl overflow-hidden hover:border-brand-gold/30 transition-all duration-500 hover:shadow-[0_20px_50px_rgba(212,175,55,0.05)] flex flex-col">
      
      <!-- Project Header/Icon -->
      <div class="p-8 pb-0 flex items-start justify-between">
        <div class="p-4 bg-brand-gold/10 text-brand-gold rounded-2xl group-hover:bg-brand-gold group-hover:text-brand-dark transition-colors duration-500">
          <lucide-icon [name]="FolderGit2" class="w-8 h-8"></lucide-icon>
        </div>
        <div class="flex gap-4">
          <a *ngIf="project.github" [href]="project.github" class="text-gray-500 hover:text-brand-gold transition-colors">
            <lucide-icon [name]="Github" class="w-6 h-6"></lucide-icon>
          </a>
          <a *ngIf="project.link" [href]="project.link" class="text-gray-500 hover:text-brand-gold transition-colors">
            <lucide-icon [name]="ExternalLink" class="w-6 h-6"></lucide-icon>
          </a>
        </div>
      </div>

      <!-- Content -->
      <div class="p-8 flex-grow">
        <h4 class="text-2xl font-bold text-white mb-2 group-hover:text-brand-gold transition-colors">
          {{ project.title }}
        </h4>
        <p *ngIf="project.subtitle" class="text-brand-gold/70 text-sm font-medium mb-4 italic">
          {{ project.subtitle }}
        </p>
        
        <div class="flex flex-wrap gap-2 mb-6">
          <span *ngFor="let tech of project.techStack" 
                class="px-3 py-1 bg-white/5 border border-white/10 rounded-full text-xs text-gray-400 font-medium">
            {{ tech }}
          </span>
        </div>

        <ul class="space-y-3 text-gray-400 text-sm leading-relaxed">
          <li *ngFor="let desc of project.description" class="flex items-start gap-2">
            <span class="text-brand-gold mt-1">▹</span>
            {{ desc }}
          </li>
        </ul>
      </div>
    </div>
  </div>
</section>
