<section id="certificates" class="min-h-screen flex flex-col justify-center pt-32 pb-24 px-8 max-w-7xl mx-auto">
  <!-- Left-aligned Header -->
  <div class="mb-16 text-left">
    <h2 class="text-xs uppercase tracking-[0.3em] text-gray-500 mb-3">CREDENTIALS</h2>
    <h3 class="text-4xl font-bold text-brand-gold italic">Certificates</h3>
  </div>

  <!-- Responsive Grid -->
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
    <div *ngFor="let cert of certificates" 
         class="group flex flex-col md:flex-row gap-6 p-6 rounded-3xl bg-brand-gray/20 border border-white/5 hover:border-brand-gold/30 transition-all duration-500 shadow-lg relative overflow-hidden">
      
      <!-- Certificate Image Thumbnail with Hover Zoom Effect -->
      <div class="relative w-full md:w-48 h-48 shrink-0 rounded-2xl overflow-hidden border border-white/10 group-hover:border-brand-gold/40 transition-colors duration-300 cursor-pointer"
           (click)="openModal(cert.image)">
        <img [src]="cert.image" 
             [alt]="cert.title" 
             class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
        <!-- Hover Overlay -->
        <div class="absolute inset-0 bg-brand-dark/70 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex flex-col items-center justify-center gap-2">
          <div class="p-3 bg-brand-gold/20 text-brand-gold rounded-full border border-brand-gold/40">
            <lucide-icon [name]="Eye" class="w-6 h-6"></lucide-icon>
          </div>
          <span class="text-xs font-bold uppercase tracking-wider text-brand-gold">View Full Screen</span>
        </div>
      </div>

      <!-- Certificate Details -->
      <div class="flex flex-col justify-between flex-grow">
        <div>
          <!-- Title & Issuer -->
          <div class="flex items-start gap-4 mb-3">
            <div class="p-2 bg-brand-gold/10 text-brand-gold rounded-xl shrink-0">
              <lucide-icon [name]="Award" class="w-6 h-6"></lucide-icon>
            </div>
            <div>
              <h4 class="text-xl font-bold text-white group-hover:text-brand-gold transition-colors leading-snug">
                {{ cert.title }}
              </h4>
              <p class="text-gray-400 text-sm font-medium mt-1">{{ cert.issuer }}</p>
            </div>
          </div>

          <!-- Highlight Bullets -->
          <ul class="space-y-2 mb-6">
            <li *ngFor="let highlight of cert.highlights" class="flex items-start gap-2 text-gray-400 text-sm leading-relaxed">
              <span class="text-brand-gold mt-1 select-none font-bold">&#8226;</span>
              <span>{{ highlight }}</span>
            </li>
          </ul>
        </div>

        <!-- Action Bar -->
        <div class="flex items-center justify-between mt-auto pt-4 border-t border-white/5">
          <!-- Date -->
          <div class="flex items-center gap-2 text-xs font-medium text-gray-500">
            <lucide-icon [name]="Calendar" class="w-4 h-4"></lucide-icon>
            {{ cert.date }}
          </div>

          <!-- Action Buttons -->
          <div class="flex items-center gap-3">
            <button (click)="openModal(cert.image)" 
                    class="flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl bg-white/5 hover:bg-brand-gold/10 text-white hover:text-brand-gold text-xs font-bold border border-white/10 hover:border-brand-gold/30 transition-all duration-300 cursor-pointer">
              <lucide-icon [name]="Eye" class="w-3.5 h-3.5"></lucide-icon>
              Preview
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Lightbox Modal -->
  <div *ngIf="selectedImage" 
       class="fixed inset-0 z-[100] flex items-center justify-center bg-brand-dark/95 backdrop-blur-md transition-all duration-300 pt-28 pb-8 px-8"
       (click)="closeModal()">
    
    <!-- Modal Content Wrapper (Shrink-wraps the image to position close button exactly on the certificate corner) -->
    <div class="relative inline-block max-w-5xl" 
         (click)="$event.stopPropagation()">
      
      <!-- Modal Close Button anchored to top-right corner of the certificate card -->
      <button (click)="closeModal()" 
              class="absolute -top-4 -right-4 p-2 rounded-full bg-brand-gold text-brand-dark hover:bg-white hover:text-brand-dark transition-all duration-300 z-50 shadow-2xl hover:scale-110 cursor-pointer border border-brand-dark/10">
        <lucide-icon [name]="X" class="w-5 h-5"></lucide-icon>
      </button>

      <img [src]="selectedImage" 
           alt="Certificate Preview" 
           class="block max-w-full max-h-[calc(100vh-12rem)] object-contain rounded-2xl border border-white/10 shadow-[0_25px_60px_-15px_rgba(0,0,0,0.9)] animate-in fade-in zoom-in-95 duration-300">
    </div>
  </div>
</section>
