<section id="home"
  class="min-h-screen flex flex-col justify-center items-center text-center px-4 pt-40 relative overflow-hidden">

  <!-- Particle Background Effect -->
  <div class="absolute inset-0 pointer-events-none opacity-20">
    <div class="absolute top-1/4 left-1/4 w-1 h-1 bg-brand-gold rounded-full shadow-[0_0_10px_2px_#d4af37]"></div>
    <div class="absolute top-1/3 right-1/4 w-1 h-1 bg-brand-gold rounded-full shadow-[0_0_10px_2px_#d4af37]"></div>
    <div class="absolute bottom-1/4 left-1/2 w-1.5 h-1.5 bg-brand-gold rounded-full shadow-[0_0_10px_2px_#d4af37]">
    </div>
    <svg class="absolute inset-0 w-full h-full">
      <line x1="25%" y1="25%" x2="75%" y2="33%" stroke="#d4af37" stroke-width="0.5" opacity="0.1" />
      <line x1="75%" y1="33%" x2="50%" y2="75%" stroke="#d4af37" stroke-width="0.5" opacity="0.1" />
    </svg>
  </div>

  <p class="text-gray-500 uppercase tracking-[0.5em] mb-12 text-sm font-bold animate-fade-in">HI, I'M</p>

  <h1
    class="text-5xl md:text-6xl lg:text-7xl font-serif text-white mb-4 flex flex-col items-center leading-none animate-fade-in">
    <span>Niranjan</span>
    <span class="text-brand-gold">Mahesh Kabade</span>
  </h1>

  <!-- Animated Tech Line -->
  <div class="min-h-[4rem] flex items-center justify-center mb-8">
    <h2 class="text-2xl md:text-3xl font-bold text-brand-gold flex items-center gap-4">
      <!-- <span class="text-brand-gold/50 text-2xl">•</span> -->
      {{ displayText }}
      <!-- <span class="text-brand-gold/50 text-2xl">•</span> -->
      <span class="cursor"></span>
    </h2>
  </div>

  <!-- Tagline -->
  <p class="text-gray-500 text-xs md:text-base tracking-wide mb-16 max-w-3xl animate-fade-in leading-relaxed">
    Full-Stack Software Engineer • SaaS Architecture • Angular + React + Django
  </p>

  <!-- Buttons -->
  <div class="flex flex-col sm:flex-row gap-6 mb-12 animate-fade-in">
    <button (click)="scrollTo('#contact', 'contact')"
      class="px-10 py-4 bg-brand-gold text-brand-dark font-bold rounded-full transition-all hover:scale-105 shadow-[0_0_20px_rgba(212,175,55,0.4)]">
      Let's Connect
    </button>
    <button (click)="openPdf()"
      class="px-10 py-4 border-2 border-brand-gold/30 text-brand-gold font-bold rounded-full transition-all hover:bg-brand-gold/10 hover:border-brand-gold">
      Download Resume
    </button>
  </div>

  <!-- Location -->
  <div class="flex items-center gap-2 text-gray-500 text-sm animate-fade-in">
    <lucide-icon [name]="MapPin" class="w-4 h-4 text-brand-gold/60"></lucide-icon>
    Pune, Maharashtra, India
  </div>
</section>
