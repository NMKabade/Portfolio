<nav class="fixed top-8 left-0 w-full z-50 flex justify-center px-4 pointer-events-none">
  <!-- Desktop Pill Navbar -->
  <div class="hidden md:flex items-center bg-brand-dark/40 backdrop-blur-xl border border-brand-gold/20 rounded-full px-10 py-4 pointer-events-auto shadow-[0_15px_35px_rgba(0,0,0,0.4)]">
    <div class="flex items-center gap-8 lg:gap-12">
      <div *ngFor="let link of navLinks" class="relative flex flex-col items-center group">
        
        <!-- Hover/Active Underline Effect -->
        <div [class]="'absolute -bottom-2 left-0 w-full h-[3px] bg-brand-gold shadow-[0_0_10px_#d4af37] transition-all duration-300 pointer-events-none ' + (activeSection === link.id ? 'opacity-100' : 'opacity-0 group-hover:opacity-100')"></div>
        
        <button (click)="scrollTo(link.target, link.id)"
           [class]="'relative text-sm font-bold tracking-wide transition-all duration-300 cursor-pointer outline-none ' + (activeSection === link.id ? 'text-brand-gold' : 'text-gray-300 group-hover:text-white')">
          {{ link.name }}
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile Toggle -->
  <div [class]="'md:hidden flex items-center bg-brand-dark/60 backdrop-blur-lg border border-brand-gold/30 rounded-full px-6 py-3 shadow-xl transition-all duration-300 ' + (isMenuOpen ? 'opacity-0 pointer-events-none' : 'opacity-100 pointer-events-auto')">
    <button (click)="toggleMenu()" class="text-brand-gold flex items-center gap-2 font-bold uppercase text-xs tracking-widest outline-none">
      <lucide-icon [name]="Menu" class="w-5 h-5"></lucide-icon>
      {{ activeSection }}
    </button>
  </div>

  <!-- Mobile Menu Overlay -->
  <div [class]="'fixed inset-0 bg-brand-dark z-[-1] transition-all duration-500 flex flex-col items-center justify-center gap-8 ' + (isMenuOpen ? 'opacity-100 pointer-events-auto' : 'opacity-0 pointer-events-none')">
    <button *ngFor="let link of navLinks" 
       (click)="scrollTo(link.target, link.id)"
       [class]="'text-3xl font-bold transition-all transform outline-none ' + (activeSection === link.id ? 'text-brand-gold scale-110' : 'text-gray-500 hover:text-white')">
      {{ link.name }}
    </button>
    <button (click)="toggleMenu()" class="mt-12 p-4 bg-brand-gold/10 rounded-full text-brand-gold border border-brand-gold/20 outline-none hover:bg-brand-gold/20 transition-colors">
      <lucide-icon [name]="X" class="w-8 h-8"></lucide-icon>
    </button>
  </div>
</nav>
