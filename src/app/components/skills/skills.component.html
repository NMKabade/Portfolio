<section id="skills" class="min-h-screen flex flex-col justify-center pt-32 pb-24 px-8 max-w-7xl mx-auto">
  <!-- Left-aligned Header -->
  <div class="mb-16 text-left">
    <h2 class="text-xs uppercase tracking-[0.3em] text-gray-500 mb-3">TECHNICAL</h2>
    <h3 class="text-4xl font-bold text-brand-gold italic mb-2">Skills & Expertise</h3>
    <p class="text-gray-500 text-lg">Tools and technologies I work with</p>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
    <div *ngFor="let category of skillCategories" 
         class="group bg-brand-gray/30 border border-white/5 rounded-2xl p-8 backdrop-blur-sm hover:border-brand-gold/40 hover:bg-brand-gray/50 hover:scale-[1.03] hover:-translate-y-3 hover:shadow-[0_20px_40px_-15px_rgba(212,175,55,0.2)] transition-all duration-500 ease-out">
      
      <div class="flex items-center gap-4 mb-6">
        <div class="text-brand-gold group-hover:rotate-12 transition-transform duration-500">
          <lucide-icon [name]="category.icon" class="w-8 h-8"></lucide-icon>
        </div>
        <h4 class="font-bold text-2xl text-brand-gold">{{ category.title }}</h4>
      </div>
      
      <ul class="space-y-4">
        <li *ngFor="let skill of category.skills" class="flex items-center gap-3 text-gray-400 group-hover:text-gray-300 transition-colors">
          <span class="text-brand-gold">▹</span>
          {{ skill }}
        </li>
      </ul>
    </div>
  </div>
</section>
