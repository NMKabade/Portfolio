<section id="skills" class="min-h-screen flex flex-col justify-center pt-32 pb-24 px-8 max-w-7xl mx-auto">
  <!-- Left-aligned Header -->
  <div class="mb-16 text-left w-full">
    <h2 class="text-xs uppercase tracking-[0.3em] text-gray-500 mb-3">EXPERTISE</h2>
    <h3 class="text-4xl font-bold text-brand-gold italic">Skills & Tools</h3>
  </div>

  <!-- Technical Skills Section -->
  <div class="w-full mb-16">
    <h3 class="text-xl font-bold text-white text-center mb-10">Technical Skills</h3>
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-y-12 gap-x-6 justify-items-center">
      <div *ngFor="let skill of technicalSkills"
        class="flex flex-col items-center justify-center gap-3 group cursor-pointer">
        <div
          class="w-16 h-16 flex items-center justify-center transition-transform duration-300 group-hover:-translate-y-2 group-hover:scale-110">
          <i *ngIf="skill.devicon"
            [class]="skill.devicon + ' text-5xl drop-shadow-md group-hover:drop-shadow-[0_0_15px_rgba(255,255,255,0.2)]'"></i>
          <lucide-icon *ngIf="skill.lucideIcon" [name]="skill.lucideIcon"
            class="w-12 h-12 text-gray-300 group-hover:text-white drop-shadow-md group-hover:drop-shadow-[0_0_15px_rgba(255,255,255,0.2)] transition-colors"></lucide-icon>
        </div>
        <span class="text-gray-400 text-sm font-medium group-hover:text-white transition-colors text-center">{{
          skill.name }}</span>
      </div>
    </div>
  </div>

  <!-- Tools & Platforms Section -->
  <div class="w-full">
    <h3 class="text-xl font-bold text-white text-center mb-10">Tools & Platforms</h3>
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-y-12 gap-x-6 justify-items-center">
      <div *ngFor="let skill of toolsAndPlatforms"
        class="flex flex-col items-center justify-center gap-3 group cursor-pointer">
        <div
          class="w-16 h-16 flex items-center justify-center transition-transform duration-300 group-hover:-translate-y-2 group-hover:scale-110">
          <i *ngIf="skill.devicon"
            [class]="skill.devicon + ' text-5xl drop-shadow-md group-hover:drop-shadow-[0_0_15px_rgba(255,255,255,0.2)] text-white'"></i>
          <lucide-icon *ngIf="skill.lucideIcon" [name]="skill.lucideIcon"
            class="w-12 h-12 text-gray-300 group-hover:text-white drop-shadow-md group-hover:drop-shadow-[0_0_15px_rgba(255,255,255,0.2)] transition-colors"></lucide-icon>
        </div>
        <span class="text-gray-400 text-sm font-medium group-hover:text-white transition-colors text-center">{{
          skill.name }}</span>
      </div>
    </div>
  </div>
</section>
